<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5f1">
    <title>Commerce Intelligence | DWDM Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="#/overview" aria-label="Commerce intelligence home">
                <span class="brand-mark">C<span>.</span></span>
                <span class="brand-copy">commerce<span>INTELLIGENCE</span></span>
            </a>

            <div class="side-label">WORKSPACE</div>
            <nav class="side-nav" aria-label="Main navigation">
                <a class="side-link active" href="#/overview" data-view="overview" aria-current="page"><span class="nav-dot"></span>Overview</a>
                <a class="side-link" href="#/forecast" data-view="forecast"><span class="nav-dot"></span>Sales forecast</a>
                <a class="side-link" href="#/customers" data-view="customers"><span class="nav-dot"></span>Customers</a>
                <a class="side-link" href="#/warehouse" data-view="warehouse"><span class="nav-dot"></span>Data warehouse</a>
            </nav>

            <div class="sidebar-bottom">
                <div class="warehouse-badge"><span class="status-light"></span>Warehouse connected</div>
                <div class="sidebar-note">DWDM LAB PROJECT<br>SALES ANALYTICS · 2026</div>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="breadcrumb-line"><span>WORKSPACE</span><span class="crumb-slash">/</span><strong id="view-name">OVERVIEW</strong></div>
                <div class="topbar-right"><span class="live-indicator"></span><span>DEMO DATA</span><span class="topbar-divider"></span><span>24 MONTHS</span></div>
            </header>

            <div id="app-error" class="alert alert-danger d-none" role="alert"></div>
            <div id="page-root" aria-live="polite"></div>

            <template id="view-overview">
            <section class="page-section overview-section" id="overview">
                <div class="section-heading">
                    <div>
                        <div class="eyebrow">PERFORMANCE SNAPSHOT <span class="eyebrow-line"></span></div>
                        <h1>Sales overview<span class="heading-period">/ 24 MONTHS</span></h1>
                        <p class="section-subtitle">A clear read on revenue, products and the people behind every order.</p>
                    </div>
                    <div class="period-stamp"><span>DATA PERIOD</span><strong>JAN 2024 — DEC 2025</strong></div>
                </div>

                <div class="metric-grid" id="metric-grid" aria-live="polite">
                    <div class="metric-skeleton"></div><div class="metric-skeleton"></div>
                    <div class="metric-skeleton"></div><div class="metric-skeleton"></div>
                </div>

                <div class="analysis-grid">
                    <article class="panel revenue-panel">
                        <div class="panel-heading"><div><div class="panel-kicker">REVENUE</div><h2>Monthly sales</h2></div><span class="panel-unit">USD · NET</span></div>
                        <div class="chart-wrap"><canvas id="revenue-chart" aria-label="Monthly revenue chart"></canvas></div>
                    </article>
                    <article class="panel category-panel">
                        <div class="panel-heading"><div><div class="panel-kicker">MIX</div><h2>Sales by category</h2></div><span class="panel-unit">REVENUE</span></div>
                        <div class="category-chart-wrap"><canvas id="category-chart" aria-label="Revenue by category chart"></canvas></div>
                        <div class="category-legend" id="category-legend"></div>
                    </article>
                    <article class="panel products-panel">
                        <div class="panel-heading"><div><div class="panel-kicker">QUANTITY RANKING</div><h2>Best sellers</h2></div><span class="panel-unit">TOP 5</span></div>
                        <div class="product-list" id="product-list"></div>
                    </article>
                </div>
            </section>
            </template>

            <template id="view-forecast">
            <section class="page-section forecast-section" id="forecast">
                <div class="section-heading compact-heading">
                    <div><div class="eyebrow">DEMAND MODEL <span class="eyebrow-line"></span></div><h2>Product sales forecast</h2><p class="section-subtitle">Linear regression learns from monthly unit sales to estimate upcoming demand.</p></div>
                    <span class="model-chip">SCIKIT-LEARN <span>·</span> LINEAR REGRESSION</span>
                </div>

                <article class="panel forecast-panel">
                    <form class="forecast-controls" id="forecast-form">
                        <label class="field-group"><span>CATEGORY</span><select class="form-select" id="category-select" required></select></label>
                        <label class="field-group"><span>PRODUCT</span><select class="form-select" id="product-select" required></select></label>
                        <label class="field-group period-field"><span>FORECAST</span><select class="form-select" id="period-select"><option value="1">Next month</option><option value="3">Next 3 months</option><option value="6">Next 6 months</option><option value="12">Next 12 months</option></select></label>
                        <button class="btn run-button" type="submit">Run forecast <span aria-hidden="true">↗</span></button>
                    </form>
                    <div class="forecast-summary" id="forecast-summary" aria-live="polite"><span>Choose a product to inspect its sales history and demand estimate.</span></div>
                    <div class="forecast-chart-wrap"><canvas id="forecast-chart" aria-label="Historical and predicted product sales chart"></canvas></div>
                    <div class="forecast-footnote" id="forecast-footnote">Model uses the full monthly history available in the warehouse.</div>
                </article>
            </section>
            </template>

            <template id="view-customers">
            <section class="page-section customers-section" id="customers">
                <div class="section-heading compact-heading">
                    <div><div class="eyebrow">PURCHASE PATTERNS <span class="eyebrow-line"></span></div><h2>Customer behavior</h2><p class="section-subtitle">Spending tiers use customer revenue quartiles; frequency is orders per observed month.</p></div>
                    <div class="export-actions"><a class="btn export-button" href="{{ url_for('export_customer_csv') }}">WEKA CSV <span aria-hidden="true">↓</span></a><a class="btn export-button secondary-export" href="{{ url_for('export_customer_arff') }}">WEKA ARFF <span aria-hidden="true">↓</span></a></div>
                </div>

                <div class="customer-grid">
                    <article class="panel segment-panel"><div class="panel-heading"><div><div class="panel-kicker">CUSTOMER VALUE</div><h2>Segment distribution</h2></div></div><div class="segment-chart-wrap"><canvas id="segment-chart" aria-label="Customer value segment chart"></canvas></div><div class="segment-key" id="segment-key"></div><p class="segment-note" id="segment-note"></p></article>
                    <article class="panel customer-table-panel">
                        <div class="panel-heading table-heading"><div><div class="panel-kicker">CUSTOMER PROFILE</div><h2>Purchase behavior</h2></div><label class="search-box"><span class="visually-hidden">Search customers</span><input id="customer-search" type="search" placeholder="Find customer..."></label></div>
                        <div class="table-responsive"><table class="table customer-table"><thead><tr><th>Customer</th><th>Orders</th><th>Avg. order</th><th>Spend</th><th>Segment</th></tr></thead><tbody id="customer-rows"></tbody></table></div>
                        <div class="table-foot" id="customer-count"></div>
                    </article>
                </div>
            </section>
            </template>

            <template id="view-warehouse">
            <section class="page-section warehouse-section" id="warehouse">
                <div class="section-heading compact-heading"><div><div class="eyebrow">ETL PIPELINE <span class="eyebrow-line"></span></div><h2>Warehouse structure</h2><p class="section-subtitle">Raw order lines are cleaned, transformed, and loaded into a SQLite star schema.</p></div></div>
                <div class="pipeline-panel">
                    <div class="pipeline-step"><span class="pipeline-index">01</span><div><strong>Raw CSV</strong><span>Historical order lines</span></div></div><span class="pipeline-arrow">→</span>
                    <div class="pipeline-step"><span class="pipeline-index">02</span><div><strong>ETL / Cleaning</strong><span>Validate · deduplicate · derive sales</span></div></div><span class="pipeline-arrow">→</span>
                    <div class="pipeline-step warehouse-step"><span class="pipeline-index">03</span><div><strong>SQLite warehouse</strong><span>Fact_Sales + 3 dimensions</span></div></div><span class="pipeline-arrow">→</span>
                    <div class="pipeline-step analytics-step"><span class="pipeline-index">04</span><div><strong>Analytics</strong><span>Sales trends · forecasts</span></div></div>
                </div>
                <div class="warehouse-card-grid">
                    <article class="warehouse-info-card fact-info-card"><span class="warehouse-card-type">FACT TABLE · SALES GRAIN</span><h3>Fact_Sales</h3><p>One row per product line on an order.</p><div class="field-list"><span>Order ID</span><span>Customer key</span><span>Product key</span><span>Date key</span><span>Quantity · Discount · Net sales · Rating</span></div></article>
                    <article class="warehouse-info-card"><span class="warehouse-card-type">DIMENSION 01</span><h3>Dim_Customer</h3><p>Who placed the order?</p><div class="field-list"><span>Customer key</span><span>Customer ID</span><span>Customer name</span></div></article>
                    <article class="warehouse-info-card"><span class="warehouse-card-type">DIMENSION 02</span><h3>Dim_Product</h3><p>What was purchased?</p><div class="field-list"><span>Product key</span><span>Product name</span><span>Category · Unit price</span></div></article>
                    <article class="warehouse-info-card"><span class="warehouse-card-type">DIMENSION 03</span><h3>Dim_Date</h3><p>When did it happen?</p><div class="field-list"><span>Date key · Full date</span><span>Year · Month · Month name</span><span>Quarter</span></div></article>
                </div>
            </section>
            </template>

            <footer class="page-footer"><span>COMMERCE INTELLIGENCE <span>·</span> DWDM MINI PROJECT</span><span>PYTHON · FLASK · SQLITE · SCIKIT-LEARN</span></footer>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
